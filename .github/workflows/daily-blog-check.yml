name: Daily Blog Check

on:
  schedule:
    # Kör varje dag 12:00 UTC för att kontrollera om artiklar behövs
    - cron: '0 12 * * *'
  workflow_dispatch: # Tillåt manuell körning

jobs:
  check-blog-schedule:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Check blog schedule and generate if needed
      env:
        SHOP_DOMAIN: ${{ secrets.SHOP_DOMAIN }}
        SHOP_ACCESS_TOKEN: ${{ secrets.SHOP_ACCESS_TOKEN }}
        GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
        PUBLISH_TO_SHOPIFY: 'true'
      run: |
        echo "Checking if blog generation is needed today..."
        node src/runBlogGenerator.js weekly || echo "No blog needed today"
        
    - name: Commit and push if changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Daily Check"
        git add -A
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Daily blog check - Auto-generated article $(date +'%Y-%m-%d')"
          git push
        fi
