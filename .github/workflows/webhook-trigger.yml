name: Webhook Product Update

on:
  workflow_dispatch:
    inputs:
      product_id:
        description: 'Product ID to update'
        required: true
        type: string
      product_title:
        description: 'Product title'
        required: true
        type: string
      vendor:
        description: 'Product vendor'
        required: false
        type: string
        default: ''

jobs:
  process-product:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Process product update
        run: |
          node -e "
          import('./src/webhookHandler.js').then(async ({ processProductUpdate }) => {
            const result = await processProductUpdate(
              '${{ github.event.inputs.product_id }}',
              '${{ github.event.inputs.product_title }}',
              '${{ github.event.inputs.vendor }}'
            );
            console.log('Result:', JSON.stringify(result, null, 2));
            process.exit(result.error ? 1 : 0);
          }).catch(console.error);
          "
        env:
          SHOP_DOMAIN: ${{ secrets.SHOP_DOMAIN }}
          SHOP_ACCESS_TOKEN: ${{ secrets.SHOP_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DRY_RUN: false
